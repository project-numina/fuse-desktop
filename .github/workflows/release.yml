name: Release installers
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  build:
    needs: check
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac --universal
          - os: windows-latest
            platform: win
            args: --win --x64
          - os: ubuntu-latest
            platform: linux
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require distribution review
        env:
          DISTRIBUTION_REVIEWED: ${{ vars.DISTRIBUTION_REVIEWED }}
        shell: bash
        run: test "$DISTRIBUTION_REVIEWED" = true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Verify stable tag matches package version
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("package.json")).version; if (!/^\d+\.\d+\.\d+$/.test(v) || process.env.GITHUB_REF_NAME !== `v${v}`) process.exit(1)'
      - run: npm ci
      - run: npm run build
      - name: Require signing credentials
        if: matrix.platform != 'linux'
        shell: bash
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          test -n "$CSC_LINK" && test -n "$CSC_KEY_PASSWORD"
          if [ "$PLATFORM" = mac ]; then
            test -n "$APPLE_ID" && test -n "$APPLE_APP_SPECIFIC_PASSWORD" && test -n "$APPLE_TEAM_ID"
          fi
      - name: Package signed installers
        env:
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder ${{ matrix.args }} --publish never -c.forceCodeSigning=${{ matrix.platform != 'linux' }}
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: installers-*
          path: installers
          merge-multiple: true
      - name: Create draft with every platform's assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git archive --format=tar.gz --prefix="fuse-desktop-${RELEASE_TAG#v}/" -o "installers/fuse-desktop-${RELEASE_TAG#v}-source.tar.gz" HEAD
          gh release create "$RELEASE_TAG" installers/* --verify-tag --draft --generate-notes --title "Fuse ${RELEASE_TAG#v}"
