name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:structure
      - run: npm run build
      - run: npm test
      - name: Smoke-test the bundle
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npx electron --no-sandbox .
        env:
          FUSE_SCREENSHOT: ${{ runner.temp }}/fuse.png
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: fuse-desktop-screenshot
          path: ${{ runner.temp }}/fuse.png
          if-no-files-found: error

  package:
    needs: quality
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DISTRIBUTION_REVIEWED == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v7
        with:
          name: fuse-desktop-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
